<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daftar Admin - Arsipin</title>
<link rel="icon" type="image/svg+xml" href="./ascon-logo.svg">
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap');
  :root{--bg:#eef6ff;--ink:#17314f;--ink-2:#345077;--muted:#60789a;--line:rgba(77,120,185,.18);--accent:#1d6ff2;--orange:#ff9f43;}
  *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px 16px;background:linear-gradient(135deg,#071d49 0%,#0b4f9c 48%,#1d8fe1 100%);color:var(--ink);font-family:"DM Sans","Segoe UI",sans-serif}.register-card{width:min(470px,100%);padding:32px;background:rgba(255,255,255,.96);border:1px solid rgba(29,111,242,.22);border-left:7px solid #0866c6;border-radius:22px;box-shadow:0 24px 55px rgba(4,31,75,.28)}.brand{text-align:center}.brand img{width:92px;height:92px;object-fit:contain;padding:9px;border-radius:22px;background:#0866c6;box-shadow:0 12px 24px rgba(8,102,198,.2)}.brand-name{margin:16px 0 4px;color:#0866c6;font:700 20px "Space Grotesk",sans-serif;letter-spacing:.04em}.kicker{color:var(--accent);font-size:11px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;text-align:center}.title{margin:8px 0;color:var(--ink);font:600 28px "Space Grotesk",sans-serif;text-align:center}.subtitle{margin:0 auto 24px;color:var(--muted);font-size:13px;line-height:1.6;text-align:center}.form{display:grid;gap:14px}.field{display:grid;gap:7px}.field label{color:var(--ink-2);font-size:12px;font-weight:600}.field input{width:100%;padding:12px 13px;border:1px solid var(--line);border-radius:11px;background:#fff;color:var(--ink);font:14px inherit}.password-wrap{position:relative}.password-wrap input{padding-right:46px}.password-toggle{position:absolute;top:50%;right:8px;width:34px;height:34px;display:grid;place-items:center;transform:translateY(-50%);border:0;border-radius:8px;background:transparent;color:var(--muted);cursor:pointer}.password-toggle:hover{background:#edf5ff}.password-toggle svg{width:18px;height:18px}.field input:focus{outline:none;border-color:rgba(29,111,242,.55);box-shadow:0 0 0 4px rgba(29,111,242,.1)}.role-fixed{display:flex;align-items:center;gap:10px;padding:12px 13px;border:1px solid rgba(29,111,242,.2);border-radius:11px;background:#edf5ff;color:var(--accent);font-size:13px;font-weight:600}.role-fixed span{display:block;margin-left:auto;color:var(--muted);font-size:11px;font-weight:400}.button{width:100%;margin-top:5px;padding:13px 16px;border:0;border-radius:11px;background:linear-gradient(135deg,var(--accent),#4c9dff);color:#fff;font:700 13px "DM Sans",sans-serif;cursor:pointer;box-shadow:0 12px 22px rgba(29,111,242,.2)}.button:hover{filter:brightness(1.04);transform:translateY(-1px)}.status{display:none;margin-top:14px;padding:11px 12px;border-radius:10px;background:#fff3e7;color:#a95d18;font-size:12px;line-height:1.45}.back{display:block;margin-top:18px;color:#0866c6;font-size:12px;font-weight:600;text-align:center;text-decoration:none}.back:hover{text-decoration:underline}@media(max-width:520px){.register-card{padding:24px 18px;border-left-width:5px}.title{font-size:24px}}
</style>
</head>
<body>
  <main class="register-card">
    <div class="brand"><img src="./ascon-logo.svg" alt="Logo Ascon"><div class="brand-name">ARSIPIN</div></div>
    <div class="kicker">Pendaftaran akun</div>
    <h1 class="title">Buat akun Admin</h1>
    <p class="subtitle">Daftarkan akun untuk mengelola dokumen dan aktivitas arsip.</p>
    <form class="form" id="registerForm">
      <div class="field"><label for="nameInput">Nama lengkap</label><input id="nameInput" name="name" type="text" placeholder="Masukkan nama lengkap" required></div>
      <div class="field"><label for="emailInput">Email</label><input id="emailInput" name="email" type="email" placeholder="Masukkan email aktif" required></div>
      <div class="field"><label for="passwordInput">Sandi</label><div class="password-wrap"><input id="passwordInput" name="password" type="password" placeholder="Minimal 8 karakter" minlength="8" required><button class="password-toggle" id="passwordToggle" type="button" aria-label="Tampilkan sandi" title="Tampilkan sandi"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"/><circle cx="12" cy="12" r="2.5"/></svg></button></div></div>
      <button class="button" type="submit">DAFTAR AKUN ADMIN</button>
    </form>
    <div class="status" id="registerStatus">Data pendaftaran siap. Tautan verifikasi akan dikirim ke email Anda.</div>
    <a class="back" href="./index.html">Kembali ke halaman login</a>
  </main>
<script>
document.getElementById('registerForm').addEventListener('submit', function(event){
  event.preventDefault();
  const email = document.getElementById('emailInput').value.trim();
  const password = document.getElementById('passwordInput').value;
  const status = document.getElementById('registerStatus');
  status.style.display = 'block';
  status.textContent = 'Membuat akun dan mengirim tautan verifikasi ke ' + email + '...';

  import('./apijs/authentication.js')
    .then(async ({registerOrResendVerification, authMessage}) => {
      await registerOrResendVerification(email, password);
      status.textContent = 'Akun berhasil dibuat. Tautan verifikasi telah dikirim ke email Anda. Silakan cek inbox dan verifikasi email sebelum masuk.';
      setTimeout(() => {
        window.location.href = './authentication.html?email=' + encodeURIComponent(email);
      }, 1400);
    })
    .catch(error => {
      status.style.display = 'block';
      const errorCode = error?.code || 'unknown';
      const errorMessage = error?.message || 'Modul Firebase tidak dapat dimuat.';
      status.textContent = 'Gagal membuat akun. Kode: ' + errorCode + '. ' + errorMessage;
    });
});
document.getElementById('passwordToggle').addEventListener('click', function(){
  const password = document.getElementById('passwordInput');
  const visible = password.type === 'text';
  password.type = visible ? 'password' : 'text';
  this.setAttribute('aria-label', visible ? 'Tampilkan sandi' : 'Sembunyikan sandi');
  this.setAttribute('title', visible ? 'Tampilkan sandi' : 'Sembunyikan sandi');
});
</script>
</body>
</html>
